<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Companion Chat</title>
<style>
*{box-sizing:border-box}
body{margin:0;height:100vh;height:100dvh;display:flex;flex-direction:column;background:#14141c;color:#eee;font-family:system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 12px;background:#1d1d2b}
header b{font-size:18px}
button,select,input,textarea{font:inherit;color:inherit}
.ic{background:none;border:0;font-size:22px}
#cfg{display:none;padding:12px 14px;background:#1d1d2b;border-top:1px solid #2c2c40;max-height:60vh;overflow-y:auto}
#cfg label{display:block;font-size:12px;opacity:.7;margin:10px 0 3px}
#cfg select{width:100%;padding:9px;border-radius:8px;border:1px solid #3a3a55;background:#14141c}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.row span{font-size:14px}
.tg{min-width:104px;padding:8px 12px;border-radius:18px;border:1px solid #3a3a55;background:#14141c}
.tg.on{background:#4a5bd8;border-color:#4a5bd8}
.btn{padding:9px 12px;border-radius:8px;border:1px solid #3a3a55;background:#14141c;margin-top:8px}
.note{font-size:12px;opacity:.6;margin-top:6px;line-height:1.35}
#rep{white-space:pre-wrap;font-size:11.5px;line-height:1.4;background:#14141c;border-radius:8px;padding:8px;margin:8px 0 0;display:none}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:82%;padding:10px 13px;border-radius:16px;line-height:1.35;white-space:pre-wrap}
.u{align-self:flex-end;background:#4a5bd8}
.b{align-self:flex-start;background:#2a2a3d}
.s{align-self:center;font-size:12px;opacity:.6}
footer{display:flex;gap:8px;padding:10px 10px calc(env(safe-area-inset-bottom,0px) + 10px);background:#1d1d2b}
#txt{flex:1;padding:11px 14px;border-radius:22px;border:1px solid #3a3a55;background:#14141c}
footer button{width:46px;height:46px;border-radius:50%;border:0;background:#4a5bd8;font-size:20px}
#mic.on{background:#e03e3e;animation:p 1s infinite}
@keyframes p{50%{transform:scale(1.12)}}
</style>
</head>
<body>
<header><b>🐾 Companion</b><button class="ic" onclick="toggleCfg()">⚙️</button></header>
<div id="cfg">
  <label>Personalidade</label>
  <select id="persona"></select>
  <div id="pdesc" class="note"></div>

  <div class="row"><span>Voz dela</span><button id="voiceOn" class="tg"></button></div>
  <label>Voz do sistema (Google)</label>
  <select id="nvoice"></select>
  <button id="testVoice" class="btn">🔊 Testar voz</button>

  <div class="row" style="margin-top:16px"><span>Consultar a Wikipédia</span><button id="wikiOn" class="tg"></button></div>
  <div class="note">Quando ela não souber, procura um resumo na Wikipédia. Só o assunto é enviado, e precisa de internet.</div>

  <div class="row" style="margin-top:16px"><span>Compreensão avançada</span><button id="embOn" class="tg"></button></div>
  <div class="note">Desligada = modo leve (quase nenhum uso de memória). Ligada = modelo de IA de ~118 MB, mais preciso, mas pesado.</div>
  <div id="embSt" class="note"></div>
  <div id="cnt" class="note"></div>
  <div id="ver" class="note"></div>
  <div id="ver2" class="note"></div>
  <button id="selfTest" class="btn">🧪 Testar compreensão</button>
  <pre id="rep"></pre>
  <button id="forget" class="btn">Esquecer meu nome</button>
</div>
<div id="chat"></div>
<footer>
  <input id="txt" placeholder="Escreva ou toque no 🎤" enterkeyhint="send">
  <button id="send">➤</button>
  <button id="mic">🎤</button>
</footer>
<script src="personas.js"></script>
<script src="knowledge.js"></script>
<script src="brain.js"></script>
<script>
const $=id=>document.getElementById(id);
const DEF={voiceOn:true,nvoice:"",emb:false,persona:"dinamica",wiki:true};
const S=Object.assign({},DEF,JSON.parse(localStorage.getItem("cfg")||"{}"));
// limpeza: remove campos de versões antigas (inclusive a chave de API que ficava em texto puro)
Object.keys(S).forEach(k=>{if(!(k in DEF))delete S[k]});
const save=()=>localStorage.setItem("cfg",JSON.stringify(S));save();
let busy=false;
const TTSP=()=>window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.TextToSpeech;

/* ---------- Voz ---------- */
function paintVoiceBtn(){const b=$("voiceOn");b.textContent=S.voiceOn?"🔊 Ligada":"🔇 Desligada";b.classList.toggle("on",S.voiceOn)}
$("voiceOn").onclick=async()=>{
  S.voiceOn=!S.voiceOn;save();paintVoiceBtn();
  if(!S.voiceOn){try{await TTSP().stop()}catch(e){}}
};
let nvList=[];
async function loadVoices(){
  const sel=$("nvoice");sel.innerHTML="";sel.add(new Option("Padrão do aparelho (atual)",""));
  try{
    const r=await TTSP().getSupportedVoices();
    nvList=r.voices||[];
    // No Android o campo "name" é igual para todas as vozes ("português Brasil"); o identificador único é o voiceURI.
    const pt=nvList.filter(v=>(v.lang||"").toLowerCase().replace("_","-").startsWith("pt"));
    pt.sort((a,b)=>((b.lang||"").toLowerCase().includes("br")-(a.lang||"").toLowerCase().includes("br"))||String(a.voiceURI).localeCompare(String(b.voiceURI)));
    pt.forEach((v,i)=>sel.add(new Option("Voz "+(i+1)+" — "+v.voiceURI+(v.localService===false?" (online)":""),v.voiceURI)));
  }catch(e){}
  sel.value=S.nvoice;if(sel.value!==S.nvoice){sel.value="";}
}
$("nvoice").onchange=()=>{S.nvoice=$("nvoice").value;save()};
async function nativeSpeak(text){
  const T=TTSP();
  if(!T)throw new Error("Plugin de voz do Android não encontrado.");
  const o={text,lang:"pt-BR",rate:1,pitch:1,volume:1,category:"playback"};
  const vi=S.nvoice?nvList.findIndex(v=>v.voiceURI===S.nvoice):-1;
  if(vi>=0)o.voice=vi;
  try{await T.stop()}catch(e){}
  await T.speak(o);
}
async function speak(text){
  if(!S.voiceOn)return;
  try{await nativeSpeak(text)}catch(e){add("Voz: "+(e.message||e),"s")}
}
$("testVoice").onclick=async()=>{
  try{await nativeSpeak("Oi! Essa é a minha voz.")}catch(e){add("Voz: "+(e.message||e),"s")}
};

/* ---------- Microfone (reconhecimento nativo) ---------- */
let listening=false;
async function nativeListen(){
  const SR=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.SpeechRecognition;
  if(!SR)return add("Plugin de reconhecimento não encontrado.","s");
  if(listening){try{await SR.stop()}catch(e){}return}
  try{
    const a=await SR.available();
    if(!a.available)return add("Reconhecimento de voz indisponível neste aparelho.","s");
    const p=await SR.requestPermissions();
    if(p.speechRecognition!=="granted")return add("Permissão do microfone negada.","s");
    listening=true;$("mic").classList.add("on");$("mic").textContent="⏹";
    const r=await SR.start({language:"pt-BR",maxResults:1,partialResults:false,popup:false});
    const t=r&&r.matches&&r.matches[0];
    if(!t)add("Não entendi, tente de novo.","s");else turn(t);
  }catch(e){add("Reconhecimento: "+(e.message||e),"s")}
  listening=false;$("mic").classList.remove("on");$("mic").textContent="🎤";
}

/* ---------- Modelo de compreensão (embeddings) ---------- */
const EMB_MSG={
  off:()=>"Desligada: ela entende só por palavras-chave.",
  loading:p=>"Carregando o modelo de compreensão…"+(p!=null?" "+p+"%":""),
  index:p=>"Preparando as frases de exemplo (só na 1ª vez)… "+p+"%",
  on:l=>"Ativa: modelo multilíngue (português do Brasil) "+(l?"guardado no app.":"baixado e guardado no aparelho."),
  fail:e=>"Modo básico: não consegui carregar o modelo ("+e+"). Ela segue funcionando por palavras-chave.",
  crash:()=>"Desativada automaticamente: o app fechou durante o carregamento do modelo (pouca memória?). Você pode tentar ligar de novo."
};
const setEmb=(k,a)=>{$("embSt").textContent=EMB_MSG[k](a);$("embOn").textContent=S.emb?"Ligada":"Desligada";$("embOn").classList.toggle("on",S.emb)};
let embLoaded=false,embBusy=false;
async function startModel(){
  if(embBusy||embLoaded)return;
  if(typeof Brain.attach!=="function")return setEmb("fail","brain.js antigo");
  if(!S.emb){Brain.detach();return setEmb("off")}
  if(localStorage.getItem("emb_loading")==="1"){localStorage.removeItem("emb_loading");S.emb=false;save();return setEmb("crash")}
  embBusy=true;localStorage.setItem("emb_loading","1");
  try{
    setEmb("loading");
    const m=await import("./embedder.js");
    await m.init(p=>setEmb("loading",p));
    await Brain.attach(m.embed,{modelId:m.MODEL_ID,onProgress:(a,b)=>setEmb("index",Math.round(a/b*100))});
    embLoaded=true;setEmb("on",m.local);
  }catch(e){Brain.detach(String(e&&e.message||e));setEmb("fail",String(e&&e.message||e).slice(0,120))}
  localStorage.removeItem("emb_loading");embBusy=false;
}
$("embOn").onclick=()=>{
  S.emb=!S.emb;save();
  if(S.emb)startModel();else{Brain.detach();embLoaded=false;setEmb("off")}
};
$("selfTest").onclick=async()=>{
  const out=$("rep");out.style.display="block";out.textContent="Testando…";
  try{
    const r=await Brain.selfTest((i,n)=>{out.textContent="Testando… "+i+"/"+n});
    const pc=(a,b)=>a+"/"+b+" ("+Math.round(100*a/b)+"%)";
    let t=(r.modelReady?"Só o modelo: "+pc(r.modelOk,r.modelTotal)+"\nModelo + regras: ":"Modelo não carregado. Palavras-chave + regras: ")+pc(r.fullOk,r.total)+"\n";
    const bad=r.rows.filter(x=>!x.ok);
    t+=bad.length?"\nErros:\n"+bad.slice(0,15).map(x=>"• \""+x.p+"\" → esperado "+x.exp+", deu "+x.full+" ["+(x.top||[]).join(" ")+"]").join("\n"):"\nSem erros.";
    out.textContent=t;
  }catch(e){out.textContent="Falha no teste: "+(e.message||e)}
};
$("forget").onclick=()=>{Brain.reset();add("Pronto, esqueci o seu nome.","s")};

/* ---------- Personalidade e Wikipédia ---------- */
function applyPrefs(){Brain.setPrefs&&Brain.setPrefs({persona:S.persona,wiki:S.wiki})}
function initPersona(){
  const P=window.Personas,sel=$("persona");
  if(!P){sel.disabled=true;sel.add(new Option("(personas.js ausente)",""));return}
  Object.keys(P.PERSONAS).forEach(k=>sel.add(new Option(P.PERSONAS[k].name,k)));
  if(!P.PERSONAS[S.persona])S.persona="dinamica";
  sel.value=S.persona;$("pdesc").textContent=P.PERSONAS[S.persona].desc;
  sel.onchange=()=>{S.persona=sel.value;save();$("pdesc").textContent=P.PERSONAS[S.persona].desc;applyPrefs()};
}
function paintWiki(){const b=$("wikiOn");b.textContent=S.wiki?"Ligada":"Desligada";b.classList.toggle("on",S.wiki)}
$("wikiOn").onclick=()=>{S.wiki=!S.wiki;save();paintWiki();applyPrefs()};

/* ---------- Tela ---------- */
function toggleCfg(){
  const c=$("cfg"),open=c.style.display!=="block";
  c.style.display=open?"block":"none";
  if(open)loadVoices();
}
function add(t,c){const d=document.createElement("div");d.className="m "+c;d.textContent=t;$("chat").appendChild(d);$("chat").scrollTop=1e9;return d}
async function turn(text){
  if(busy||!text)return;busy=true;
  add(text,"u");
  const wait=add("…","s");
  let rp;
  try{rp=await Brain.reply(text)}catch(e){rp="Hmm, deu um nó na minha cabecinha. Tenta de novo?"}
  wait.remove();add(rp,"b");
  busy=false;
  await speak(rp);
}
const sendTxt=()=>{const t=$("txt").value.trim();if(!t)return;$("txt").value="";turn(t)};
$("send").onclick=sendTxt;
$("txt").onkeydown=e=>{if(e.key==="Enter")sendTxt()};
$("mic").onclick=nativeListen;

const NEW_BRAIN=typeof Brain.selfTest==="function"&&typeof Brain.attach==="function";
const NEW3=NEW_BRAIN&&/^3\./.test(Brain.version||"");
$("ver").textContent=NEW3?"Cérebro: brain.js v"+Brain.version+" ✓":"⚠️ brain.js desatualizado: substitua www/brain.js pelo novo e gere o APK de novo.";
$("ver2").textContent="Conhecimento: "+(window.Knowledge?"knowledge.js v"+Knowledge.version+" ✓":"⚠️ knowledge.js ausente")+" · Personalidades: "+(window.Personas?"personas.js v"+Personas.version+" ✓":"⚠️ personas.js ausente");
if(!NEW3)add("⚠️ O arquivo www/brain.js do app é uma versão antiga. Substitua e gere o APK de novo.","s");
const c=Brain.count();
$("cnt").textContent=typeof c==="object"?"Conhecimentos offline: "+(c.kb||0)+" · frases-base: "+c.base+" · combinações: "+c.combos.toLocaleString("pt-BR"):"";
initPersona();paintWiki();applyPrefs();
paintVoiceBtn();setEmb(S.emb?"loading":"off");
setTimeout(loadVoices,800);setTimeout(loadVoices,3000);
add("Oi! Toque no 🎤 para falar.","s");
startModel();
</script>
</body>
</html>
