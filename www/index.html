<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Companion Chat</title>
<style>
*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;flex-direction:column;background:#14141c;color:#eee;font-family:system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 12px;background:#1d1d2b}
header b{font-size:18px}
button,select,input,textarea{font:inherit;color:inherit}
.ic{background:none;border:0;font-size:22px}
#cfg{display:none;padding:12px 14px;background:#1d1d2b;border-top:1px solid #2c2c40}
#cfg label{display:block;font-size:12px;opacity:.7;margin:8px 0 3px}
#cfg input,#cfg select,#cfg textarea{width:100%;padding:9px;border-radius:8px;border:1px solid #3a3a55;background:#14141c}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:82%;padding:10px 13px;border-radius:16px;line-height:1.35;white-space:pre-wrap}
.u{align-self:flex-end;background:#4a5bd8}
.b{align-self:flex-start;background:#2a2a3d}
.s{align-self:center;font-size:12px;opacity:.6}
footer{display:flex;gap:8px;padding:10px 10px calc(env(safe-area-inset-bottom,0px) + 10px);background:#1d1d2b}
#txt{flex:1;padding:11px 14px;border-radius:22px;border:1px solid #3a3a55;background:#14141c}
footer button{width:46px;height:46px;border-radius:50%;border:0;background:#4a5bd8;font-size:20px}
#mic.on{background:#e03e3e;animation:p 1s infinite}
@keyframes p{50%{transform:scale(1.12)}}
</style>
</head>
<body>
<header><b>🐾 Companion</b><button class="ic" onclick="toggleCfg()">⚙️</button></header>
<div id="cfg">
  <label>Chave da API do Gemini (aistudio.google.com/apikey)</label>
  <input id="key" type="password" placeholder="AIza...">
  <label>Cérebro (modelo de texto)</label>
  <select id="engine"><option value="proprio">Modelo próprio (local, sem internet)</option><option value="gemini">Gemini (nuvem)</option></select>
  <div id="cnt" style="font-size:12px;opacity:.6;margin-top:4px"></div>
  <label>Modo de voz</label>
  <select id="mode"><option value="gemini">Gemini (voz e áudio na nuvem)</option><option value="native">Nativo Android (reconhecimento + voz do aparelho)</option></select>
  <label>Voz do Gemini</label>
  <select id="voice"></select>
  <label>Voz nativa do Android</label>
  <select id="nvoice"></select>
  <label>Personalidade</label>
  <textarea id="persona" rows="3"></textarea>
  <label>Modelo de texto</label>
  <input id="mText">
  <label>Modelo de voz</label>
  <input id="mTts">
</div>
<div id="chat"></div>
<footer>
  <input id="txt" placeholder="Escreva ou toque no 🎤" enterkeyhint="send">
  <button id="send">➤</button>
  <button id="mic">🎤</button>
</footer>
<script src="brain.js"></script>
<script>
const $=id=>document.getElementById(id);
const VOICES=["Kore","Puck","Zephyr","Charon","Fenrir","Leda","Aoede","Orus","Callirrhoe","Enceladus","Umbriel","Algieba","Despina","Achernar","Sulafat","Gacrux"];
const DEF={key:"",voice:"Kore",persona:"Você é um bichinho companheiro fofo e curioso que vive no mundo de realidade aumentada do usuário. Fale de forma carinhosa, natural e curta (1 a 2 frases), no mesmo idioma do usuário.",mText:"gemini-3.8-flash",mTts:"gemini-3.1-flash-tts-preview",mode:"native",nvoice:"",engine:"proprio"};
const S=Object.assign({},DEF,JSON.parse(localStorage.getItem("cfg")||"{}"));
const hist=[];
let rec=null,actx=null,src=null,busy=false;

VOICES.forEach(v=>$("voice").add(new Option(v,v)));
["key","engine","mode","voice","nvoice","persona","mText","mTts"].forEach(k=>{
  $(k).value=S[k];
  $(k).onchange=()=>{S[k]=$(k).value.trim();localStorage.setItem("cfg",JSON.stringify(S))};
});
function loadVoices(){
  const sel=$("nvoice");sel.innerHTML="";sel.add(new Option("Padrão do aparelho",""));
  try{speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith("pt")).forEach(v=>sel.add(new Option(v.name+" ("+v.lang+")",v.name)))}catch(e){}
  sel.value=S.nvoice;
}
loadVoices();try{speechSynthesis.onvoiceschanged=loadVoices}catch(e){}
function nativeSpeak(text){return new Promise(res=>{
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang="pt-BR";
  const v=speechSynthesis.getVoices().find(x=>x.name===S.nvoice);
  if(v){u.voice=v;u.lang=v.lang}
  u.onend=u.onerror=res;speechSynthesis.speak(u);
})}
let listening=false;
async function nativeListen(){
  const SR=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.SpeechRecognition;
  if(!SR)return add("Plugin de reconhecimento não encontrado.","s");
  if(listening){try{await SR.stop()}catch(e){}return}
  try{
    const a=await SR.available();
    if(!a.available)return add("Reconhecimento de voz indisponível neste aparelho.","s");
    const p=await SR.requestPermissions();
    if(p.speechRecognition!=="granted")return add("Permissão do microfone negada.","s");
    listening=true;$("mic").classList.add("on");$("mic").textContent="⏹";
    const r=await SR.start({language:"pt-BR",maxResults:1,partialResults:false,popup:false});
    const t=r&&r.matches&&r.matches[0];
    if(!t)add("Não entendi, tente de novo.","s");else turn(t);
  }catch(e){add("Reconhecimento: "+(e.message||e),"s")}
  listening=false;$("mic").classList.remove("on");$("mic").textContent="🎤";
}
function toggleCfg(){const c=$("cfg");c.style.display=c.style.display==="block"?"none":"block"}
$("cnt").textContent="Respostas possíveis no modelo próprio: "+Brain.count().toLocaleString("pt-BR");
if(!S.key&&S.engine==="gemini")toggleCfg();

function add(t,c){const d=document.createElement("div");d.className="m "+c;d.textContent=t;$("chat").appendChild(d);$("chat").scrollTop=1e9;return d}

async function gem(model,body){
  if(!S.key){toggleCfg();throw new Error("Coloque sua chave da API nas configurações.")}
  for(let i=0;;i++){
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,{
      method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":S.key},body:JSON.stringify(body)});
    if(r.ok)return r.json();
    if((r.status===503||r.status===429)&&i<3){await new Promise(s=>setTimeout(s,1500*2**i));continue}
    throw new Error((await r.text()).slice(0,300));
  }
}

// Envia um turno (texto ou áudio WAV em base64) e fala a resposta
async function turn(text,wavB64){
  if(busy)return;busy=true;
  const wait=add("…","s");
  try{
    if(S.engine==="proprio"){
      if(wavB64)throw new Error("No modelo próprio, use o modo de voz Nativo Android para falar.");
      add(text,"u");
      const rp=Brain.reply(text);
      wait.remove();add(rp,"b");
      busy=false;await speak(rp);return;
    }
    let parts,userBubble=null;
    if(wavB64){
      parts=[{inlineData:{mimeType:"audio/wav",data:wavB64}},{text:'Transcreva o áudio e responda como o companheiro. Retorne apenas JSON: {"transcript":"...","reply":"..."}'}];
    }else{parts=[{text}];userBubble=add(text,"u")}
    const body={systemInstruction:{parts:[{text:S.persona}]},contents:[...hist,{role:"user",parts}]};
    if(wavB64)body.generationConfig={responseMimeType:"application/json"};
    const j=await gem(S.mText,body);
    let out=j.candidates[0].content.parts.map(p=>p.text||"").join("");
    let reply=out,said=text;
    if(wavB64){const o=JSON.parse(out);reply=o.reply;said=o.transcript;add(said,"u")}
    hist.push({role:"user",parts:[{text:said}]},{role:"model",parts:[{text:reply}]});
    wait.remove();add(reply,"b");
    await speak(reply);
  }catch(e){wait.remove();add("Erro: "+e.message,"s")}
  busy=false;
}

async function speak(text){
  if(S.mode==="native")return nativeSpeak(text);
  const j=await gem(S.mTts,{contents:[{parts:[{text}]}],generationConfig:{responseModalities:["AUDIO"],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:S.voice}}}}});
  const b64=j.candidates[0].content.parts[0].inlineData.data;
  const bin=atob(b64),n=bin.length>>1,f=new Float32Array(n);
  for(let i=0;i<n;i++){let v=bin.charCodeAt(2*i)|(bin.charCodeAt(2*i+1)<<8);if(v>32767)v-=65536;f[i]=v/32768}
  actx=actx||new AudioContext();
  if(actx.state==="suspended")await actx.resume();
  try{src&&src.stop()}catch(e){}
  const buf=actx.createBuffer(1,n,24000);buf.copyToChannel(f,0);
  src=actx.createBufferSource();src.buffer=buf;src.connect(actx.destination);src.start();
}

async function startRec(){
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  const ctx=new AudioContext(),s=ctx.createMediaStreamSource(stream),p=ctx.createScriptProcessor(4096,1,1),chunks=[];
  p.onaudioprocess=e=>chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
  s.connect(p);p.connect(ctx.destination);
  rec={stream,ctx,s,p,chunks};
}
function stopRec(){
  const{stream,ctx,s,p,chunks}=rec;rec=null;
  p.disconnect();s.disconnect();stream.getTracks().forEach(t=>t.stop());
  const rate=ctx.sampleRate;ctx.close();
  let len=chunks.reduce((a,c)=>a+c.length,0);
  const buf=new ArrayBuffer(44+len*2),v=new DataView(buf);
  const w=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))};
  w(0,"RIFF");v.setUint32(4,36+len*2,true);w(8,"WAVEfmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,len*2,true);
  let o=44;for(const c of chunks)for(let i=0;i<c.length;i++,o+=2){const x=Math.max(-1,Math.min(1,c[i]));v.setInt16(o,x<0?x*32768:x*32767,true)}
  const u=new Uint8Array(buf);let bin="";
  for(let i=0;i<u.length;i+=8192)bin+=String.fromCharCode.apply(null,u.subarray(i,i+8192));
  return{b64:btoa(bin),secs:len/rate};
}

$("mic").onclick=async()=>{
  if(S.mode==="native")return nativeListen();
  if(busy)return;
  actx=actx||new AudioContext();actx.resume();
  try{
    if(!rec){await startRec();$("mic").classList.add("on");$("mic").textContent="⏹"}
    else{
      $("mic").classList.remove("on");$("mic").textContent="🎤";
      const r=stopRec();
      if(r.secs<0.4)return add("Áudio muito curto","s");
      turn(null,r.b64);
    }
  }catch(e){add("Microfone: "+e.message,"s")}
};
const sendTxt=()=>{const t=$("txt").value.trim();if(!t)return;$("txt").value="";actx=actx||new AudioContext();actx.resume();turn(t)};
$("send").onclick=sendTxt;
$("txt").onkeydown=e=>{if(e.key==="Enter")sendTxt()};
add("Oi! Toque no 🎤 para falar (toque de novo para enviar).","s");
</script>
</body>
</html>
