name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - name: Cache do modelo de compreensão
        uses: actions/cache@v4
        with:
          path: www/models
          key: modelo-minilm-multilingual-v1
      - name: Preparar modelo de compreensão (biblioteca + modelo)
        # Se o download falhar, o APK ainda é gerado; o app baixa o modelo na 1ª abertura.
        continue-on-error: true
        run: npm run setup
      - run: npx cap add android
      - name: Permissão do microfone
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application|' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: companion-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
